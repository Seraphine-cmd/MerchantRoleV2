plugins {
    id 'java'
}

group = 'com.bap80'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }
}

dependencies {
    // Supplied by the server. Keep the plugin jar self-contained and small.
    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.21'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.4.6'
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Minecraft 26.3 runs on Java 25.
    options.release = 25
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named('jar') {
    archiveBaseName = 'MerchantRole'
}
